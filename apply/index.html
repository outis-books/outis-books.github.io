<style>
:root{--bg:#faf6ef;--ink:#2a2118;--soft:#6f6252;--line:#e8dccb}
@media (prefers-color-scheme:dark){:root{--bg:#17130e;--ink:#ede4d6;--soft:#b3a38c;--line:#3a3127}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
body::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#A6512F 0 25%,#2F5573 25% 50%,#6B4270 50% 75%,#2C5A3B 75% 100%)}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 56px}
h1{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:900;letter-spacing:-.01em}
.lead{color:var(--soft);font-size:15px;margin-top:6px}
a.card{display:flex;gap:18px;align-items:center;text-decoration:none;color:inherit;border-radius:18px;padding:18px;margin-top:22px;box-shadow:0 8px 26px rgba(40,30,15,.12)}
a.card>div{min-width:0;flex:1}
a.card img{width:92px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.25);flex:0 0 auto}
.k{font-size:13px;font-weight:900;letter-spacing:.06em}
.t{font-size:20px;font-weight:900;line-height:1.3;margin-top:4px}
.m{font-size:14.5px;margin-top:6px;opacity:.85}
.go{display:inline-block;margin-top:10px;font-size:14px;font-weight:900;padding:7px 16px;border-radius:30px}
a.card.a{background:linear-gradient(160deg,#ffe8cf,#ffc99c);color:#3a1b08}.a .k{color:#b5400f}.a .go{background:#c2410c;color:#fff}
a.card.b{background:linear-gradient(160deg,#3d6e34,#284f24);color:#fff}.b .k{color:#d8a23a}.b .go{background:#d8a23a;color:#2a1d08}
.back{display:block;margin-top:34px;font-size:13.5px;color:var(--soft);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>지금 모집 중</h1>

  <a class="card a" href="https://outis-books.github.io/three-pages/">
    <img src="artists-way.jpg" alt="『아티스트 웨이』 표지">
    <div><div class="k">1기 모집</div><div class="t">하루 세 페이지 쓰기 챌린지</div>

  </a>

  <a class="card b" href="https://outis-books.github.io/silent-spring/">
    <img src="../silent-spring/silent-spring.jpg" alt="『침묵의 봄』 표지">
    <div><div class="k">6기 모집</div><div class="t">벽돌책 완독 챌린지 『침묵의 봄』</div>
    <div class="m">11월 2일~24일 · 8명 선착순 · 무료</div><span class="go">안내 보기 →</span></div>
  </a>
