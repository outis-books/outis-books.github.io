<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서 처방전 — 이서윤</title>
<meta name="description" content="지금 어떤 마음이신가요. 그 마음에 놓을 책 세 권을 골라 드립니다. 읽은 사람이 그때 적어 둔 말과 함께.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="이서윤 · 우티스">
<meta property="og:title" content="독서 처방전">
<meta property="og:description" content="지금 어떤 마음이신가요. 아홉 마음 가운데 하나를 고르시면, 그 마음에 놓을 책 열 권을 처방해 드립니다.">
<meta property="og:image" content="https://outis-books.github.io/prescription/og-prescription.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://outis-books.github.io/prescription/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --paper:#F8F6F0;
    --card:#FFFFFF;
    --ink:#25201C;
    --ink-soft:#6A6156;
    --line:#DFD8C8;
    --accent:#2C5A3B;
    --accent-soft:#E3EDE4;
    --accent-deep:#1D3F28;
    --terra:#A6512F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height:1.75; word-break:keep-all; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; display:block; height:6px;
    background:linear-gradient(90deg,#A6512F 0 25%,#2F5573 25% 50%,#6B4270 50% 75%,#2C5A3B 75% 100%);
    position:sticky; top:0; z-index:5;
  }
  .wrap{max-width:660px; margin:0 auto; padding:30px 20px 70px;}
  .serif{font-family:'Noto Serif KR', serif;}

  /* ── 표지 ── */
  #cover{text-align:center; padding-top:34px;}
  .badge{
    display:inline-block; font-size:12px; letter-spacing:.2em; color:var(--accent);
    border:1px solid var(--line); background:#fff; padding:6px 15px; border-radius:999px; margin-bottom:24px;
  }
  h1{font-family:'Noto Serif KR', serif; font-size:36px; line-height:1.3; margin:0; font-weight:700; letter-spacing:-.02em;}
  .lede{font-family:'Noto Serif KR', serif; font-size:17px; color:var(--ink-soft); margin-top:14px; line-height:1.75;}
  .ask{
    font-family:'Noto Serif KR', serif; font-size:22px; margin:38px 0 4px; font-weight:500;
  }
  .ask-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:20px;}

  .moods{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mood{
    cursor:pointer; font:inherit; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:17px 16px;
    transition:all .13s ease; position:relative; overflow:hidden;
  }
  .mood:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-2px);}
  .mood b{display:block; font-family:'Noto Serif KR', serif; font-size:17.5px; font-weight:700; letter-spacing:-.01em; line-height:1.4;}
  .mood span{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:5px;}
  .mood i{
    position:absolute; right:13px; top:13px; font-style:normal;
    font-family:'DM Mono', monospace; font-size:11px; color:var(--line);
  }

  .cover-note{
    margin-top:26px; font-size:13px; color:var(--ink-soft);
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:left;
  }

  /* ── 처방전 ── */
  #sheet{display:none;}
  .rx{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:26px 24px 28px; position:relative;
    box-shadow:0 2px 0 var(--line), 0 10px 30px rgba(37,32,28,.06);
  }
  .rx::before{
    content:""; position:absolute; inset:8px; border:1px dashed var(--line);
    border-radius:2px; pointer-events:none;
  }
  .rx-inner{position:relative;}
  .rx-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--accent); padding-bottom:11px; margin-bottom:22px; gap:12px;
  }
  .rx-title{font-family:'Noto Serif KR', serif; font-size:21px; font-weight:700; color:var(--accent-deep);}
  .rx-title em{font-style:normal; font-family:'DM Mono', monospace; font-size:12px; color:var(--accent); letter-spacing:.14em; display:block; margin-bottom:3px;}
  .rx-date{font-family:'DM Mono', monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; flex:none; line-height:1.6;}

  .mood-name{font-family:'Noto Serif KR', serif; font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.35;}
  .mood-word{
    font-family:'Noto Serif KR', serif; font-size:15.5px; color:#4C463E;
    margin:13px 0 0; padding-left:14px; border-left:3px solid var(--accent-soft);
  }

  .dose{
    margin:22px 0 6px; background:var(--accent-soft); border-radius:10px;
    padding:12px 15px; font-size:14px; color:var(--accent-deep);
  }
  .dose b{font-family:'DM Mono', monospace; font-size:10.5px; letter-spacing:.14em; display:block; margin-bottom:3px; opacity:.75;}

  .sec{
    margin:26px 0 2px; padding-bottom:8px; border-bottom:1.5px solid var(--accent);
  }
  .sec b{font-family:'Noto Serif KR', serif; font-size:17px; color:var(--accent-deep); display:block;}
  .sec span{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .more-sec{border-bottom-color:var(--line); margin-top:34px;}
  .more-sec b{color:var(--ink-soft);}

  .rx-books{margin-top:6px;}
  .rx-book{border-top:1px dashed var(--line); padding:17px 0 3px;}
  .rx-book:first-child{border-top:none;}
  .rx-book.plain .bt{font-size:17.5px;}
  .rx-book.plain .no{color:var(--ink-soft);}
  .no{font-family:'DM Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:.1em;}
  .bt{font-family:'Noto Serif KR', serif; font-size:19px; font-weight:700; letter-spacing:-.01em; margin-top:3px;}
  .ba{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .bw{font-size:14.5px; margin-top:9px; color:#4C463E;}
  .bnote{
    margin-top:11px; background:#FAF8F2; border:1px solid var(--line);
    border-radius:9px; padding:11px 13px; font-size:13.5px; color:#4C463E;
  }
  .bnote b{
    display:block; font-family:'DM Mono', monospace; font-size:10px; letter-spacing:.12em;
    color:var(--terra); margin-bottom:5px;
  }

  .note-personal{
    margin-top:20px; border-top:1px dashed var(--line); padding-top:15px;
    font-size:13px; color:var(--ink-soft); line-height:1.8;
  }
  .note-personal b{color:var(--ink);}

  .care{
    margin-top:20px; border:1px solid #E6DCC8; background:#FBF6E9;
    border-radius:10px; padding:13px 15px; font-size:13.5px; color:#6A5B3C;
  }

  .stamp{
    margin-top:24px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .stamp .who{font-family:'Noto Serif KR', serif; font-size:14px; color:var(--ink-soft);}
  .stamp .who b{color:var(--ink); font-size:15.5px;}
  .seal{
    flex:none; width:62px; height:62px; border:2px solid var(--terra); border-radius:50%;
    color:var(--terra); display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Noto Serif KR', serif; font-size:12.5px; line-height:1.3; font-weight:700;
    transform:rotate(-9deg); opacity:.85;
  }

  .actions{margin-top:26px; display:flex; gap:9px; justify-content:center; flex-wrap:wrap;}
  .btn{
    border:none; cursor:pointer; font:inherit; background:var(--accent); color:#fff;
    padding:13px 30px; border-radius:999px; font-size:15px; font-weight:600;
    box-shadow:0 4px 13px rgba(44,90,59,.22); transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{background:#fff; color:var(--ink-soft); border:1px solid var(--line); box-shadow:none; font-weight:500; font-size:14px; padding:12px 24px;}

  .footer{margin-top:40px; text-align:center; font-size:13px; color:var(--ink-soft); line-height:1.9;}
  .footer .rule{width:38px; height:1px; background:var(--line); margin:0 auto 18px;}
  .footer a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);}
  .cross{
    margin-top:18px; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; font-size:13.5px; text-align:left;
  }
  .cross a{color:var(--terra); font-weight:600; border-bottom-color:#EBD9CE;}

  @media (max-width:440px){
    h1{font-size:29px;}
    .moods{grid-template-columns:1fr;}
    .mood b{font-size:17px;}
    .mood-name{font-size:23px;}
    .rx{padding:22px 17px 24px;}
    .stamp{flex-direction:column; align-items:flex-start;}
  }
  @media print{
    .actions,.footer,.cross{display:none;}
    body{background:#fff;}
    .rx{box-shadow:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="cover">
    <span class="badge">독 서 처 방 전</span>
    <h1>독서 처방전</h1>
    <p class="lede">약이 되는 책은 없습니다.<br>다만 곁에 두면 조금 덜 혼자인 책은 있습니다.</p>

    <div class="ask serif">지금 어떤 마음이신가요?</div>
    <div class="ask-sub">하나만 고르시면 그 마음에 놓을 책 열 권을 드립니다</div>

    <div class="moods" id="moods"></div>

    <div class="cover-note">
      처방은 세 칸으로 나뉩니다. <b>읽고 기록한 책</b>에는 그 책을 덮고 나서 그때 적어 둔 말이
      그대로 붙어 있고, <b>읽은 책</b>은 읽었으나 소감을 남기지 않은 책, <b>아직 읽지 않았지만
      권하는 책</b>은 말 그대로입니다. 어느 쪽인지 숨기지 않았고, 없는 소감을 지어 붙이지도 않았습니다.
    </div>
  </section>

  <section id="sheet"></section>

</div>

<script>
/* ══════════ 아홉 마음과 처방 ══════════
   books[].note = 이서윤이 그 책을 읽고 그때 적어 둔 말 (볼트 독서기록에서 그대로)
   heavy = true 이면 「책보다 먼저」 안내를 함께 띄운다
*/
const RX = [
  {
    key:'sad', name:'슬플 때', hint:'이유가 있든 없든',
    word:'슬픔은 없애는 것이 아니라 이름을 붙여 주는 일입니다. 이름이 붙은 슬픔은 조금 작아집니다. 오늘은 그 이름을 찾아 주는 책들을 드립니다.',
    dose:'하루 열 쪽. 다 울고 나서 펴셔도 늦지 않습니다.',
    heavy:true,
    books:[
      {t:'나의 사유재산', a:'메리 루플', w:'슬픔을 파란빛·자줏빛·회색빛으로 나눠 부릅니다. 내 슬픔이 무슨 빛인지 찾다 보면, 어느새 슬픔을 바깥에서 보고 계실 겁니다.',
       note:'노년을 향해 성큼성큼 걸어가는 우리에겐 슬픔을 피해 갈 수 없습니다.'},
      {t:'그러니 우리 너무 애쓰지 말아요', a:'태리북스', w:'가볍고 손 안에 쏙 들어와 어디서든 펼칠 수 있는 책입니다. 오늘은 제목만 읽으셔도 됩니다.',
       note:'무엇보다 힘든 요즘, 제목에서 위안을 얻습니다.'},
      {t:'정원의 위로', a:'김선미', w:'식물 곁에서 회복한 사람의 기록입니다. 사람에게 받지 못한 위로를 나무와 꽃에게 받는 날이 있습니다.',
       note:'일상의 소란함을 피하고 싶을 때 찾아가는 곳은 꽃과 나무가 있는 곳입니다. 그들의 조용한 응원에 힘입어 위로를 받으면서 삶의 균형을 찾습니다.'},
      {t:'다시 쓰는 마음', a:'김미영', w:'서른여덟 편이 다 짧고 따뜻합니다. 대단한 사건이 없어서 오히려 편안하게 읽힙니다.',
       note:'서른여덟 편의 글들이 따스한 봄날의 햇살처럼 포근합니다.'},
      {t:'듣는 사람', a:'박연준', w:'시인이 고전을 읽고 쓴 후기들입니다. 마음이 딱딱한 날에는 부드러운 문장부터 넣어야 합니다.',
       note:'감성이 풍부한 시인이 쓴 고전 후기는 순두부처럼 부드럽습니다.'},
      {t:'안녕이라 그랬어', a:'김애란', w:'위로가 어긋나는 순간을 아는 소설입니다. 잘 위로받지 못한 날에는, 위로를 잘 모르는 사람들의 이야기가 오히려 곁에 남습니다.'}
    ]
  },
  {
    key:'lonely', name:'외로울 때', hint:'혼자인 게 힘들 때',
    word:'혼자 있는 것과 외로운 것은 다릅니다. 이 책들은 혼자인 시간을 견디는 법이 아니라, 그 시간을 쓰는 법 쪽으로 데려갑니다.',
    dose:'밤에 한 편씩. 소리 내어 읽으시면 더 좋습니다.',
    books:[
      {t:'홀로 사는 즐거움', a:'법정', w:'혼자를 결핍이 아니라 하나의 살림으로 다룹니다. 마흔 편이 다 짧아, 아무 데나 펴도 그날 몫이 됩니다.',
       note:'무엇을 위해 살아야 할 것인지, 어떻게 사는 것이 인간다운 삶인지를 거듭 묻습니다.'},
      {t:'어서 오세요, 휴남동 서점입니다', a:'황보름', w:'작은 서점에 사람들이 하나씩 모여드는 이야기입니다. 힘을 주지 않고 넘어가는데, 덮고 나면 누군가 곁에 앉았다 간 느낌이 남습니다.',
       note:'꼭꼭 숨겨두었던 내면과의 은밀한 대화, 상처를 극복하면서 앞으로 나아가는 방법, 절망보다는 희망을 발견하는 힘.'},
      {t:'나무처럼 살아간다', a:'리즈 마빈', w:'혼자 서 있는 것처럼 보이는 나무들이 사실은 뿌리로 이어져 있습니다. 외로움에 관한 가장 조용한 반박입니다.',
       note:'나무는 혼자 사는 것 같지만 서로 연결되어 있습니다. 뿌리를 통해 자양분을 나누면서 서로를 돕습니다.'},
      {t:'라이온의 간식', a:'오가와 이토', w:'남은 시간을 아는 사람들이 모여 사는 집의 이야기입니다. 외로움을 없애 주지는 않지만, 외로움이 나만의 것이 아님을 알려 줍니다.',
       note:'인생의 마지막에 다시 한번 먹고 싶은 간식은 무엇인가.'},
      {t:'너무 시끄러운 고독', a:'보후밀 흐라발', w:'삼십오 년간 폐지를 압축해 온 사람의 독백입니다. 혼자인 시간이 사람을 얼마나 깊게 만드는지 보여 줍니다.',
       note:'백서른두 쪽 분량의 날씬한 책이나 결코 가볍지 않은 작품입니다. 따라서 느리게 읽을 수밖에 없습니다.'},
      {t:'그림자를 말하는 사람', a:'안규철', w:'퇴직 이후의 혼자를 정면으로 다룹니다. 은둔자로 살지, 세상에 다시 발을 들일지 — 그 갈림길에 선 사람의 기록입니다.',
       note:'퇴직 이후 마주하게 된 새로운 일상에 대한 솔직한 이야기가 공감됩니다.'},
      {t:'월든', a:'헨리 데이비드 소로', w:'혼자 사는 일을 실패가 아니라 실험으로 바꿔 놓은 책입니다. 가진 것이 적어도 삶이 초라해지지 않는다는 걸 보여 줍니다.',
       note:'집값을 두고 남편과 이야기하다 〈월든〉을 꺼냈습니다. 우리에게 꼭 집이 있어야 하는가, 그런 물음이 남았습니다.'}
    ]
  },
  {
    key:'anxious', name:'불안할 때', hint:'앞이 캄캄할 때',
    word:'불안은 아직 오지 않은 일에 미리 내는 세금입니다. 이 책들은 시선을 오늘 하루로 데려옵니다.',
    dose:'아침에 한 꼭지. 잠들기 직전에는 펴지 않으시는 편이 좋습니다.',
    books:[
      {t:'내가 틀릴 수도 있습니다', a:'비욘 나티코 린데블라드', w:'잘나가던 경영인이 승려가 되었다가, 병을 얻고 마지막으로 남긴 말들입니다. 제목 한 줄이 불안의 절반을 덜어 냅니다.'},
      {t:'몽테뉴, 사유의 힘', a:'임재성', w:'사백 년 전 사람이 흔들림 한복판에서 어떻게 중심을 잡았는지 봅니다. 불안이 나만의 병이 아님을 알게 됩니다.',
       note:'일상에서도 어김없이 두려움, 불안, 혼란 그리고 자신감도 점점 빛을 잃어갔습니다. 몽테뉴가 말했듯이, 흔들림 속에서도 내 안의 중심을 찾아야 합니다.'},
      {t:'채근담', a:'홍자성', w:'한 꼭지가 서너 줄입니다. 사백 년 전 사람도 같은 걸 견뎠다는 사실이, 생각보다 큰 힘이 됩니다.',

      {t:'셀프퓨처', a:'벤저민 하디', w:'미래의 나에게 편지를 쓰게 합니다. 막연한 다짐을 날짜가 있는 계획으로 바꿔 놓습니다.',

      {t:'이제는 폼나게 살아보자', a:'안주석', w:'퇴직 앞뒤의 사람에게 지금 당장 할 일과 나중에 챙길 일을 나눠 줍니다. 막막함을 목록으로 바꿔 주는 책입니다.',

/* ══════════ 함께 권하는 책 ══════════
   볼트(인스타 독서기록 121권)에 소감이 남아 있지 않은 책들. 읽으셨는지 여부와는 별개다 —
   볼트는 인스타에 올린 것만 모은 것이라, 읽었지만 기록이 없는 책이 많다.
   ⚠️ 그러므로 화면에서 "읽지 않았다"고 단정하지 않는다. 소감이 없다고만 말한다.
   ⚠️ 여기에는 「읽고 나서 남긴 말」을 붙이지 않는다 — 없는 소감을 지어내는 순간
   이 처방전의 근거가 통째로 무너진다.
   → 우티스님이 읽으신 책으로 확인되고 소감을 새로 적어 주시면 위 칸으로 올린다.
*/
const MORE = {
  sad:[
    {t:'슬픔을 공부하는 슬픔', a:'신형철', read:true, w:'슬픔을 겪는 일과 이해하는 일은 다르다고 말하는 평론집입니다.'},
    {t:'아몬드', a:'손원평', read:true, w:'감정을 느끼지 못하는 아이를 통해 감정이 무엇인지 되묻습니다.'},
    {t:'H마트에서 울다', a:'미셸 자우너', w:'엄마를 잃은 뒤 음식으로 사람을 기억하는 이야기입니다.'},
    {t:'당신이 옳다', a:'정혜신', w:'섣부른 조언 대신 그냥 곁에 있어 주는 법을 가르칩니다.'}
  ],
  lonely:[
    {t:'노인과 바다', a:'어니스트 헤밍웨이', read:true, w:'혼자 싸우는 사람의 존엄에 관한 가장 짧고 단단한 이야기입니다.'},
    {t:'불편한 편의점', a:'김호연', read:true, w:'낯선 사람들이 조금씩 서로에게 자리를 내주는 이야기입니다.'},
    {t:'자기 앞의 생', a:'에밀 아자르', w:'세상에 둘뿐인 사람들이 서로의 전부가 되는 이야기입니다.'}
  ],
  anxious:[
    {t:'죽음의 수용소에서', a:'빅터 프랭클', read:true, w:'어떤 상황에서도 태도만은 고를 수 있다는 것을 증언합니다.'},
    {t:'불안', a:'알랭 드 보통', w:'불안이 개인의 결함이 아니라 시대의 구조에서 온다고 설명합니다.'},
    {t:'아직도 가야 할 길', a:'M. 스콧 펙', w:'삶은 원래 고되다는 첫 문장에서 오히려 힘이 나는 책입니다.'}
  ],
  angry:[
    {t:'비폭력대화', a:'마셜 로젠버그', read:true, w:'화를 참는 대신 정확하게 말하는 법을 훈련시킵니다.'},
    {t:'화', a:'틱낫한', read:true, w:'화를 억누르지도 터뜨리지도 않고 돌보는 법을 말합니다.'},
    {t:'분노의 포도', a:'존 스타인벡', w:'개인의 화가 아니라 시대의 화가 어디에서 오는지 봅니다.'}
  ],
  drained:[
    {t:'하마터면 열심히 살 뻔했다', a:'하완', read:true, w:'힘을 빼고 사는 쪽을 택한 사람의 담담한 기록입니다.'},
    {t:'죽고 싶지만 떡볶이는 먹고 싶어', a:'백세희', read:true, w:'무기력의 한복판을 숨기지 않고 적은 상담 기록입니다.'},
    {t:'피로사회', a:'한병철', read:true, w:'지친 것이 내 탓이 아니라 시대의 구조 탓임을 짚어 줍니다.'},
    {t:'아무것도 하지 않는 법', a:'제니 오델', w:'쉬는 일을 게으름이 아니라 저항으로 다시 봅니다.'}
  ],
  loss:[
    {t:'상실 수업', a:'엘리자베스 퀴블러 로스', read:true, w:'애도에도 단계가 있다는 것을 알려 준 고전입니다.'},
    {t:'아침의 피아노', a:'김진영', read:true, w:'철학자가 자신의 죽음을 앞두고 남긴 마지막 기록입니다.'},
    {t:'모리와 함께한 화요일', a:'미치 앨봄', read:true, w:'떠나는 사람과 남는 사람이 나눈 열네 번의 화요일입니다.'}
  ],
  aging:[
    {t:'백년을 살아보니', a:'김형석', read:true, w:'백 살까지 살아 본 사람이 직접 답하는 드문 책입니다.'},
    {t:'어떻게 죽을 것인가', a:'아툴 가완디', w:'의사가 쓴 책인데 결론은 의료가 아니라 삶에 관한 것입니다.'},
    {t:'늙는다는 착각', a:'엘렌 랭어', w:'시계를 거꾸로 돌린 실험으로 나이가 마음의 문제이기도 함을 보입니다.'}
  ],
  compare:[
    {t:'미움받을 용기', a:'기시미 이치로', read:true, w:'남의 인정 없이 사는 법을 대화체로 풀어냅니다.'},
    {t:'달과 6펜스', a:'서머싯 몸', read:true, w:'남들이 정해 준 삶을 버린 사람의 극단적인 사례입니다.'},
    {t:'자존감 수업', a:'윤홍균', read:true, w:'비교가 습관이 된 사람에게 가장 먼저 권해지는 책입니다.'}
  ],
  restart:[
    {t:'연금술사', a:'파울로 코엘료', read:true, w:'다시 떠나는 사람들이 오래도록 첫 책으로 고른 이야기입니다.'},
    {t:'아주 작은 습관의 힘', a:'제임스 클리어', read:true, w:'결심 대신 하루 한 칸으로 바꾸는 방법을 말합니다.'},
    {t:'그릿', a:'앤절라 더크워스', read:true, w:'재능보다 오래 하는 힘이 결과를 만든다는 연구입니다.'},
    {t:'갈매기의 꿈', a:'리처드 바크', read:true, w:'무리에서 벗어나 제 방식으로 나는 법을 익히는 이야기입니다.'}
  ]
};

const CARE = '마음이 오래 무겁거나 하루하루가 무너질 정도라면, 책보다 먼저 사람을 만나시면 좋겠습니다. 가까운 이에게 말을 꺼내시거나 전문가의 도움을 받으시는 일은 조금도 부끄러운 일이 아닙니다.';

/* ── 표지 ── */
(function(){
  const box = document.getElementById('moods');
  RX.forEach((m,i)=>{
    const b = document.createElement('button');
    b.className = 'mood';
    b.innerHTML = '<i>0'+(i+1)+'</i><b>'+m.name+'</b><span>'+m.hint+'</span>';
    b.onclick = ()=>prescribe(m.key);
    box.appendChild(b);
  });
})();

function today(){
  const d = new Date();
  return d.getFullYear()+'. '+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getDate()).padStart(2,'0');
}

function prescribe(key){
  const m = RX.find(x=>x.key===key);
  let h = '<div class="rx"><div class="rx-inner">';

  h += '<div class="rx-head">'
     + '<div class="rx-title"><em>PRESCRIPTION</em>독서 처방전</div>'
     + '<div class="rx-date">'+today()+'<br>이서윤 · 우티스의 북살롱</div>'
     + '</div>';

  h += '<div class="mood-name">'+m.name+'</div>';
  h += '<p class="mood-word">'+m.word+'</p>';
  h += '<div class="dose"><b>복 용 법</b>'+m.dose+'</div>';

  const more = MORE[m.key] || [];
  const readMore = more.filter(b=>b.read);
  const unread   = more.filter(b=>!b.read);
  const total    = m.books.length + more.length;
  let n = 0;

  function section(title, sub, cls){
    return '<div class="sec '+(cls||'')+'"><b>'+title+'</b><span>'+sub+'</span></div>';
  }
  function bookRow(b, plain){
    n++;
    return '<div class="rx-book'+(plain?' plain':'')+'">'
      + '<div class="no">'+String(n).padStart(2,'0')+'</div>'
      + '<div class="bt">'+b.t+'</div>'
      + '<div class="ba">'+b.a+'</div>'
      + '<div class="bw">'+b.w+'</div>'
      + (b.note ? '<div class="bnote"><b>읽고 나서 남긴 말</b>'+b.note+'</div>' : '')
      + '</div>';
  }

  h += section('읽고 기록한 책', '제가 읽고, 그때 남겨 둔 말이 함께 있습니다');
  h += '<div class="rx-books">' + m.books.map(b=>bookRow(b,false)).join('') + '</div>';

  if(readMore.length){
    h += section('읽은 책', '읽었지만 따로 남겨 둔 소감이 없는 책입니다', 'more-sec');
    h += '<div class="rx-books">' + readMore.map(b=>bookRow(b,true)).join('') + '</div>';
  }
  if(unread.length){
    h += section('아직 읽지 않았지만 권하는 책', '제가 읽지는 않았습니다. 그래도 이 마음에 권할 만한 책입니다', 'more-sec');
    h += '<div class="rx-books">' + unread.map(b=>bookRow(b,true)).join('') + '</div>';
  }

  if(m.heavy) h += '<div class="care">'+CARE+'</div>';

  h += '<div class="note-personal">'
     + '이 처방은 <b>지극히 개인적인 생각</b>입니다. 제가 읽고 느낀 자리에서 고른 것이라 모든 분께 맞지는 않습니다. '
     + '같은 마음이라도 사람마다 필요한 책이 다르니, 참고로만 삼아 주시면 좋겠습니다.'
     + '</div>';

  h += '<div class="stamp">'
     + '<div class="who">위 '+total+'권을 처방합니다.<br><b>이서윤</b> · 북칼럼니스트</div>'
     + '<div class="seal">읽고<br>쓰고<br>건너감</div>'
     + '</div>';

  h += '</div></div>';

  h += '<div class="actions">'
     + '<button class="btn" onclick="backHome()">다른 마음 고르기</button>'
     + '<button class="btn ghost" onclick="window.print()">처방전 저장 · 인쇄</button>'
     + '</div>';

  h += '<div class="cross">'
     + '오늘의 마음 말고, <b>내 독서가 어느 쪽으로 기울어 있는지</b> 궁금하시다면 — '
     + '<a href="https://outis-books.github.io/reading/">나의 독서 편식 진단 →</a>'
     + '</div>';

  h += '<div class="footer"><div class="rule"></div>'
     + '「읽고 나서 남긴 말」은 이서윤이 그 책을 읽고 그때 실제로 적어 둔 문장입니다.<br>없는 소감을 지어 붙이지는 않았습니다.'
     + '<div style="margin-top:14px; font-size:12.5px;"><a href="https://outis-books.github.io/">이서윤의 문장연구소 · 우티스의 북살롱 →</a></div>'
     + '</div>';

  const s = document.getElementById('sheet');
  s.innerHTML = h;
  document.getElementById('cover').style.display='none';
  s.style.display='block';
  window.scrollTo({top:0, behavior:'instant'});
}

function backHome(){
  document.getElementById('sheet').style.display='none';
  document.getElementById('cover').style.display='block';
  window.scrollTo({top:0, behavior:'instant'});
}
</script>
</body>
</html>
